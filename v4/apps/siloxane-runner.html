<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Siloxane App</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px system-ui, sans-serif; }
    #boot { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; padding: 24px; text-align: center; }
    #boot.error { color: #f9dedc; }
    #frame { border: 0; width: 100%; height: 100%; display: none; }
    .spin { width: 28px; height: 28px; border: 3px solid #333; border-top-color: #25ffff; border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="spin"></div><div id="msg">Loading Siloxane package…</div></div>
  <iframe id="frame" title="Siloxane app" allow="microphone; camera; geolocation; autoplay; clipboard-read; clipboard-write; fullscreen"></iframe>
  <script src="../core/siloxane.js"></script>
  <script>
(async function () {
  const boot = document.getElementById('boot');
  const msg = document.getElementById('msg');
  const frame = document.getElementById('frame');
  const params = new URLSearchParams(location.search);
  const packageId = params.get('id') || params.get('package_id');

  function slog(level, msg) {
    const payload = {
      type: 'WebDeskLog',
      level: level || 'log',
      src: 'siloxane',
      msg: String(msg)
    };
    try { window.parent && window.parent.postMessage(payload, '*'); } catch (_) {}
    try { window.top && window.top !== window && window.top.postMessage(payload, '*'); } catch (_) {}
    try { console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log']('[siloxane]', msg); } catch (_) {}
  }
  function notifyParent(title, body, level) {
    const payload = {
      type: 'webdesk:notify',
      title: title || 'Siloxane',
      body: body || '',
      level: level || 'error',
      source: 'siloxane',
      packageId: packageId || null,
      at: Date.now()
    };
    slog(level === 'error' ? 'error' : 'info', (title || 'Siloxane') + ': ' + (body || ''));
    try { window.parent && window.parent.postMessage(payload, '*'); } catch (_) {}
    try { window.top && window.top !== window && window.top.postMessage(payload, '*'); } catch (_) {}
  }

  function fail(t) {
    const text = t || 'Failed to open package';
    boot.classList.add('error');
    msg.textContent = text;
    const spin = boot.querySelector('.spin');
    if (spin) spin.remove();
    notifyParent('Siloxane error', text, 'error');
  }

  function withTimeout(promise, ms, label) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error((label || 'Operation') + ' timed out after ' + ms + 'ms')), ms);
      Promise.resolve(promise).then(
        (v) => { clearTimeout(t); resolve(v); },
        (e) => { clearTimeout(t); reject(e); }
      );
    });
  }

  if (!packageId) {
    fail('Missing package id');
    return;
  }

  if (!window.WebDeskSiloxane) {
    fail('Siloxane runtime missing');
    return;
  }

  msg.textContent = 'Reading package from storage…';
  slog('info', 'getPackage ' + packageId);
  let rec;
  try {
    rec = await withTimeout(WebDeskSiloxane.getPackage(packageId), 15000, 'Package storage read');
  } catch (e) {
    fail('Storage error: ' + (e.message || e));
    return;
  }
  if (!rec || !rec.cfg) {
    fail('Package not installed: ' + packageId);
    return;
  }

  const cfg = rec.cfg;
  document.title = cfg.name || 'Siloxane App';
  if (cfg.background_color) document.body.style.background = cfg.background_color;

  // Online package stored after successful probe — open remote URL
  if (!cfg.offline) {
    msg.textContent = 'Opening remote app…';
    try {
      const probe = await WebDeskSiloxane.probeOnlineUrl(cfg.start_url);
      if (!probe.ok) {
        fail(probe.error || "Can't open remote app (CORS or network).");
        return;
      }
    } catch (e) {
      fail("Can't open remote app: " + (e.message || e));
      return;
    }
    frame.style.display = 'block';
    boot.style.display = 'none';
    slog('info', 'launch remote ' + cfg.start_url);
    frame.src = cfg.start_url;
    return;
  }

  const files = rec.files || {};
  const paths = Object.keys(files);
  if (!paths.length) {
    fail('Offline package has no files');
    return;
  }

  msg.textContent = 'Preparing ' + paths.length + ' files…';
  slog('info', 'offline files=' + paths.length);

  function mimeFor(path) {
    const p = path.toLowerCase();
    if (p.endsWith('.html') || p.endsWith('.htm')) return 'text/html';
    if (p.endsWith('.js') || p.endsWith('.mjs')) return 'text/javascript';
    if (p.endsWith('.css')) return 'text/css';
    if (p.endsWith('.json') || p.endsWith('.webmanifest')) return 'application/json';
    if (p.endsWith('.svg')) return 'image/svg+xml';
    if (p.endsWith('.png')) return 'image/png';
    if (p.endsWith('.jpg') || p.endsWith('.jpeg')) return 'image/jpeg';
    if (p.endsWith('.gif')) return 'image/gif';
    if (p.endsWith('.webp')) return 'image/webp';
    if (p.endsWith('.woff2')) return 'font/woff2';
    if (p.endsWith('.woff')) return 'font/woff';
    if (p.endsWith('.ttf')) return 'font/ttf';
    if (p.endsWith('.mp3')) return 'audio/mpeg';
    if (p.endsWith('.wav')) return 'audio/wav';
    if (p.endsWith('.mp4')) return 'video/mp4';
    if (p.endsWith('.wasm')) return 'application/wasm';
    return 'application/octet-stream';
  }

  // Build blob URL map for every file (case-insensitive + query-stripped lookup)
  const blobUrls = {};

  let built = 0;
  for (const p of paths) {
    const buf = files[p];
    const blob = new Blob([buf], { type: mimeFor(p) });
    const url = URL.createObjectURL(blob);
    blobUrls[p] = url;
    blobUrls['./' + p] = url;
    blobUrls[p.toLowerCase()] = url;
    built++;
    if (built === 1 || built === paths.length || built % 25 === 0) {
      msg.textContent = 'Preparing files… ' + built + '/' + paths.length;
    }
  }

  function stripQuery(u) {
    return String(u || '').split('#')[0].split('?')[0];
  }

  function resolveLocal(rel, basePath) {
    rel = stripQuery(rel).replace(/\\/g, '/');
    if (!rel) return '';
    let joined;
    if (rel.startsWith('/')) joined = rel.replace(/^\/+/, '');
    else {
      const baseDir = basePath.includes('/') ? basePath.replace(/\/[^/]*$/, '/') : '';
      joined = baseDir + rel;
    }
    const parts = [];
    for (const seg of joined.split('/')) {
      if (!seg || seg === '.') continue;
      if (seg === '..') { if (parts.length) parts.pop(); }
      else parts.push(seg);
    }
    return parts.join('/');
  }

  function lookupBlob(rel, basePath) {
    const key = resolveLocal(rel, basePath);
    if (!key) return null;
    return blobUrls[key] || blobUrls['./' + key] || blobUrls[key.toLowerCase()] || null;
  }

  function rewriteText(text, filePath) {
    return String(text)
      .replace(/\b(src|href|poster|data-src|data-href)\s*=\s*(["'])([^"']+)\2/gi, function (_, attr, q, url) {
        if (/^(https?:|data:|blob:|javascript:|#|mailto:|tel:)/i.test(url)) return attr + '=' + q + url + q;
        const hit = lookupBlob(url, filePath);
        return attr + '=' + q + (hit || url) + q;
      })
      .replace(/url\(\s*(['"]?)([^)'"]+)\1\s*\)/gi, function (full, q, url) {
        if (/^(https?:|data:|blob:)/i.test(url)) return full;
        const hit = lookupBlob(url, filePath);
        if (hit) return 'url(' + (q || '"') + hit + (q || '"') + ')';
        return full;
      })
      .replace(/\b(import\s+(?:[^"'()]+from\s*)?|export\s+[^"'()]*from\s*|import\s*\(\s*)(["'])([^"']+)\2/gi, function (full, pre, q, url) {
        if (/^(https?:|data:|blob:)/i.test(url)) return full;
        const hit = lookupBlob(url, filePath);
        if (!hit) return full;
        return full.replace(q + url + q, q + hit + q);
      });
  }

  // Rewrite CSS url() before HTML links them
  for (const p of paths) {
    if (!/\.css$/i.test(p)) continue;
    try {
      const text = new TextDecoder().decode(files[p]);
      const blob = new Blob([rewriteText(text, p)], { type: 'text/css' });
      const url = URL.createObjectURL(blob);
      blobUrls[p] = url;
      blobUrls['./' + p] = url;
      blobUrls[p.toLowerCase()] = url;
    } catch (_) {}
  }

  // Rewrite relative imports inside JS so modules resolve to blobs
  for (const p of paths) {
    if (!/\.m?js$/i.test(p)) continue;
    try {
      const text = new TextDecoder().decode(files[p]);
      const blob = new Blob([rewriteText(text, p)], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      blobUrls[p] = url;
      blobUrls['./' + p] = url;
      blobUrls[p.toLowerCase()] = url;
    } catch (_) {}
  }

  const entry = files['index.html'] ? 'index.html' : (files['index.htm'] ? 'index.htm' : null);
  if (!entry) {
    fail('Package has no index.html');
    return;
  }
  let html = new TextDecoder().decode(files[entry]);
  html = rewriteText(html, entry);
  // Prevent auto-dark inversion inside package apps
  if (!/<meta\s+name=["']color-scheme["']/i.test(html)) {
    html = html.replace(/<head([^>]*)>/i, '<head$1><meta name="color-scheme" content="light dark">');
  }

  const pageBlob = new Blob([html], { type: 'text/html' });
  const pageUrl = URL.createObjectURL(pageBlob);

  frame.setAttribute('allowtransparency', 'true');
  frame.style.background = 'transparent';
  frame.style.display = 'block';
  boot.style.display = 'none';
  slog('info', 'launch blob page');
  frame.src = pageUrl;
})().catch(function (e) {
  const boot = document.getElementById('boot');
  const msg = document.getElementById('msg');
  const text = e && e.message ? e.message : String(e);
  boot.classList.add('error');
  msg.textContent = text;
  const spin = boot.querySelector('.spin');
  if (spin) spin.remove();
  try {
    const payload = { type: 'webdesk:notify', title: 'Siloxane error', body: text, level: 'error', source: 'siloxane', at: Date.now() };
    window.parent && window.parent.postMessage(payload, '*');
    window.top && window.top !== window && window.top.postMessage(payload, '*');
  } catch (_) {}
});
  </script>
</body>
</html>
