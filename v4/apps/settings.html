<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            margin: 0;
            font-family: Roboto, sans-serif;
            background: radial-gradient(circle at top left, rgba(45, 60, 80, 0.22), rgba(10, 10, 10, 0.94));
            color: var(--wd-text-main);
        }

        .settings-app {
            display: flex;
            height: 100vh;
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
        }

        .sidebar,
        .main-content {
            background: var(--wd-glass-bg);
            border: var(--wd-glass-border);
            backdrop-filter: blur(8px);
            border-radius: var(--wd-radius-lg);
        }

        .sidebar {
            width: 220px;
            padding: 16px 0;
        }

        .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--wd-text-muted);
            border-left: 2px solid transparent;
            transition: 0.2s ease;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--wd-text-main);
        }

        .sidebar-item.active {
            color: var(--wd-text-main);
            border-left-color: var(--wd-accent);
            background: rgba(255, 255, 255, 0.12);
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow: auto;
        }

        .main-content h2 {
            margin-top: 0;
            margin-bottom: 14px;
        }

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }

        .wallpaper-item {
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            border-radius: var(--wd-radius-md);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid transparent;
        }

        .wallpaper-item:hover {
            transform: translateY(-2px);
        }

        .wallpaper-item.active {
            border-color: var(--wd-accent);
            box-shadow: var(--wd-focus-ring);
        }
    </style>
</head>
<body>
    <div class="settings-app">
        <div class="sidebar">
            <div class="sidebar-item active">Wallpaper</div>
            <div onclick="window.location = './appmaker.html';" class="sidebar-item">Apps</div>
        </div>
        <div class="main-content">
            <h2>Wallpaper</h2>
            <div class="wallpaper-grid">
                <div class="wallpaper-item" style="background-image: url('https://76836.github.io/Akari/wallpapers/akari.jpg')" onclick="setWallpaper(this.style.backgroundImage)"></div>
                <div class="wallpaper-item" style="background-image: url('https://76836.github.io/Akari/wallpapers/luna.png')" onclick="setWallpaper(this.style.backgroundImage)"></div>
                <div class="wallpaper-item" style="background-image: url('https://76836.github.io/Akari/wallpapers/backdrop.png')" onclick="setWallpaper(this.style.backgroundImage)"></div>
                <div class="wallpaper-item" style="background-image: url('https://76836.github.io/Akari/wallpapers/Foreshadowing.jpg')" onclick="setWallpaper(this.style.backgroundImage)"></div>
                <div class="wallpaper-item" style="background-image: url('https://76836.github.io/Akari/wallpapers/colors.jpg')" onclick="setWallpaper(this.style.backgroundImage)"></div>
            </div>
        </div>
    </div>
    <script>
        function setWallpaper(url) {
            url = url.slice(4, -1).replace(/["']/g, '');
            window.parent.postMessage({ type: 'setWallpaper', url }, '*');
            document.querySelectorAll('.wallpaper-item').forEach(item => {
                item.classList.toggle('active', item.style.backgroundImage.includes(url));
            });
        }
    </script>
</body>
</html>
