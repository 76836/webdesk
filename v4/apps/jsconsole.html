<!DOCTYPE html>
<html id="html" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Console</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            height:100vh;
            width:100vw;
            margin:0;
            background-color: black;
            color: green;
            overflow-wrap: break-word;
            overflow-x: hidden;
            font-size:larger;
        }

        #terminal {
            width: 100%;
            white-space: pre-wrap;
        }

        #input {
            outline: none;
            border: none;
            width: 100%;
            font-family: 'Courier New', monospace;
            background-color: black;
            color: blue;
            margin:0;
            font-size:larger;
        }
    </style>
</head>
<body onclick="document.getElementById('input').focus();">

<div id="terminal"></div>
<input id="input" type="text" autofocus autocomplete="off" spellcheck="false">

<script>
(function () {
    const term = document.getElementById('terminal');
    const input = document.getElementById('input');
    const history = [];
    let histIdx = -1;

    function say(text) {
        term.innerHTML += text + '\n';
        input.value = '';
        try { window.scrollTo(0, document.body.scrollHeight); } catch (_) {}
    }

    function inputsay(text) {
        text = "<b style='color:blue;'>" + escapeHtml(text) + "</b>";
        term.innerHTML += text + '\n';
        input.value = '';
        try { window.scrollTo(0, document.body.scrollHeight); } catch (_) {}
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function desk() {
        try {
            return window.parent && window.parent !== window ? window.parent : window;
        } catch (_) {
            return window;
        }
    }

    function help() {
        say('JavaScript Console (WebDesk native)\nExpressions evaluate in the WebDesk page context.\n\nhelp          this text\nclear         clear output\nwindows       list open WebDesk windows\napps          list registered apps\nfirefox       GeckoHost / Firefox status\n[any JS]      evaluate (e.g. 1+1)');
    }

    function listWindows() {
        const d = desk();
        const wm = d.WebDesk && d.WebDesk.windowManager;
        if (!wm || !wm.openWindows) {
            say('WebDesk windowManager not found');
            return;
        }
        const rows = [];
        wm.openWindows.forEach(function (w, id) {
            rows.push(id + '  ' + ((w.config && w.config.title) || '') + '  ' + (w.state || '') + (w.native ? ' native' : ''));
        });
        say(rows.length ? rows.join('\n') : '(no open windows)');
    }

    function listApps() {
        const d = desk();
        const apps = d.WebDesk && d.WebDesk.appManager && d.WebDesk.appManager.apps;
        if (!apps) {
            say('WebDesk appManager not found');
            return;
        }
        const rows = [];
        apps.forEach(function (cfg, id) {
            rows.push(id + '  ' + (cfg.title || '') + (cfg.WDNative ? ' WDNative' : ''));
        });
        say(rows.length ? rows.join('\n') : '(none)');
    }

    function firefoxStatus() {
        const d = desk();
        const ff = d.WebDeskFirefox || window.WebDeskFirefox;
        const gh = d.GeckoHost || window.GeckoHost;
        if (ff) say('WebDeskFirefox API present');
        else say('WebDeskFirefox not in this context (Firefox runs in its own iframe)');
        if (gh) {
            say('GeckoHost ready=' + !!(gh.isReady && gh.isReady()) + ' booted=' + !!(gh.isBooted && gh.isBooted()));
        } else {
            say('GeckoHost not in this context');
        }
    }

    function run(line) {
        const s = (line || '').trim();
        if (!s) return;
        inputsay(s);
        history.push(s);
        histIdx = history.length;
        const low = s.toLowerCase();
        if (low === 'help' || low === '?') return help();
        if (low === 'clear' || low === 'cls') {
            term.innerHTML = '';
            return;
        }
        if (low === 'windows') return listWindows();
        if (low === 'apps') return listApps();
        if (low === 'firefox') return firefoxStatus();

        try {
            const d = desk();
            let result;
            try {
                result = (new d.Function('return (' + s + ')')).call(d);
            } catch (_) {
                result = (new d.Function(s)).call(d);
            }
            if (result !== undefined) {
                try {
                    say(typeof result === 'string' ? result : JSON.stringify(result, null, 2));
                } catch (_) {
                    say(String(result));
                }
            }
        } catch (e) {
            say(e && e.message ? e.message : String(e));
        }
    }

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const v = input.value;
            input.value = '';
            run(v);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (histIdx > 0) {
                histIdx--;
                input.value = history[histIdx] || '';
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (histIdx < history.length - 1) {
                histIdx++;
                input.value = history[histIdx] || '';
            } else {
                histIdx = history.length;
                input.value = '';
            }
        }
    });

    window.WebDeskJSConsole = { run: run, say: say, desk: desk };
    say('JavaScript Console, v1.0 (subNatural look).\nType "help" for more info.\n###################################');
    input.focus();
})();
</script>

</body>
</html>
