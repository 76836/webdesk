<!DOCTYPE html>
<html id="html" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Console</title>
    <style>
        :host, .wd-native-body, html, body {
            font-family: 'Courier New', monospace !important;
            margin: 0 !important;
            background-color: #000 !important;
            color: #0f0 !important;
            overflow-wrap: break-word;
            overflow-x: hidden;
            font-size: larger !important;
            height: 100%;
            width: 100%;
        }
        html, body { height: 100vh; width: 100vw; }
        #terminal {
            width: 100%;
            white-space: pre-wrap;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: larger;
        }
        #input {
            outline: none;
            border: none;
            width: 100%;
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #00f;
            margin: 0;
            font-size: larger;
            display: block;
        }
    </style>
</head>
<body onclick="document.getElementById('input').focus();">

<div id="terminal"></div>
<input id="input" type="text" autofocus autocomplete="off" spellcheck="false">

<script>
(function () {
    const term = document.getElementById('terminal');
    const input = document.getElementById('input');
    const history = [];
    let histIdx = -1;
    let liveLogs = true;

    function desk() {
        try {
            return window.parent && window.parent !== window ? window.parent : window;
        } catch (_) {
            return window;
        }
    }

    function say(text) {
        term.innerHTML += text + '\n';
        input.value = '';
        try {
            const root = term.getRootNode && term.getRootNode();
            if (root && root.host) root.host.scrollTop = root.host.scrollHeight;
            else window.scrollTo(0, document.body.scrollHeight);
        } catch (_) {}
    }

    function inputsay(text) {
        text = "<b style='color:blue;'>" + escapeHtml(text) + "</b>";
        term.innerHTML += text + '\n';
        input.value = '';
        try {
            const root = term.getRootNode && term.getRootNode();
            if (root && root.host) root.host.scrollTop = root.host.scrollHeight;
            else window.scrollTo(0, document.body.scrollHeight);
        } catch (_) {}
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatLog(line) {
        const ts = new Date(line.t).toLocaleTimeString();
        const tag = (line.level === 'error' || line.level === 'warn') ? line.level : (line.src || 'log');
        return '[' + ts + ' ' + tag + '] ' + line.msg;
    }

    function attachLiveLogs() {
        const d = desk();
        const bus = d.WebDeskLog || window.WebDeskLog;
        if (!bus || !bus.on) {
            say('WebDeskLog not available yet — open this console from WebDesk native.');
            return;
        }
        // backlog
        (bus.dump(50) || []).forEach(function (line) {
            say(formatLog(line));
        });
        bus.on(function (line) {
            if (!liveLogs) return;
            say(formatLog(line));
        });
        say('--- live logs on (type "logs off" to mute) ---');
    }

    function help() {
        say('JavaScript Console (WebDesk native)\nExpressions evaluate in the WebDesk page context.\n\nhelp          this text\nclear         clear output\nlogs on|off   live Firefox/console feed\nlogs          dump recent log buffer\nwindows       list open WebDesk windows\napps          list registered apps\nfirefox       GeckoHost / isolation status\n[any JS]      evaluate (e.g. 1+1)');
    }

    function listWindows() {
        const d = desk();
        const wm = d.WebDesk && d.WebDesk.windowManager;
        if (!wm || !wm.openWindows) {
            say('WebDesk windowManager not found');
            return;
        }
        const rows = [];
        wm.openWindows.forEach(function (w, id) {
            rows.push(id + '  ' + ((w.config && w.config.title) || '') + '  ' + (w.state || '') + (w.native ? ' native' : ''));
        });
        say(rows.length ? rows.join('\n') : '(no open windows)');
    }

    function listApps() {
        const d = desk();
        const apps = d.WebDesk && d.WebDesk.appManager && d.WebDesk.appManager.apps;
        if (!apps) {
            say('WebDesk appManager not found');
            return;
        }
        const rows = [];
        apps.forEach(function (cfg, id) {
            rows.push(id + '  ' + (cfg.title || '') + (cfg.WDNative ? ' WDNative' : ''));
        });
        say(rows.length ? rows.join('\n') : '(none)');
    }

    function firefoxStatus() {
        const d = desk();
        say('crossOriginIsolated=' + !!d.crossOriginIsolated);
        const gh = d.GeckoHost || window.GeckoHost;
        if (gh) {
            say('GeckoHost ready=' + !!(gh.isReady && gh.isReady()) + ' booted=' + !!(gh.isBooted && gh.isBooted()));
        } else {
            say('GeckoHost not loaded (open Firefox first)');
        }
        const ff = d.WebDeskFirefox || window.WebDeskFirefox;
        say(ff ? 'WebDeskFirefox API present' : 'WebDeskFirefox API absent');
    }

    function run(line) {
        const s = (line || '').trim();
        if (!s) return;
        inputsay(s);
        history.push(s);
        histIdx = history.length;
        const low = s.toLowerCase();
        if (low === 'help' || low === '?') return help();
        if (low === 'clear' || low === 'cls') {
            term.innerHTML = '';
            return;
        }
        if (low === 'logs' || low === 'logs on') {
            if (low === 'logs') {
                const bus = desk().WebDeskLog || window.WebDeskLog;
                if (!bus) return say('no WebDeskLog');
                (bus.dump(80) || []).forEach(function (line) { say(formatLog(line)); });
                return;
            }
            liveLogs = true;
            return say('live logs on');
        }
        if (low === 'logs off') {
            liveLogs = false;
            return say('live logs off');
        }
        if (low === 'windows') return listWindows();
        if (low === 'apps') return listApps();
        if (low === 'firefox') return firefoxStatus();

        try {
            const d = desk();
            let result;
            try {
                result = (new d.Function('return (' + s + ')')).call(d);
            } catch (_) {
                result = (new d.Function(s)).call(d);
            }
            if (result !== undefined) {
                try {
                    say(typeof result === 'string' ? result : JSON.stringify(result, null, 2));
                } catch (_) {
                    say(String(result));
                }
            }
        } catch (e) {
            say(e && e.message ? e.message : String(e));
        }
    }

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const v = input.value;
            input.value = '';
            run(v);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (histIdx > 0) {
                histIdx--;
                input.value = history[histIdx] || '';
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (histIdx < history.length - 1) {
                histIdx++;
                input.value = history[histIdx] || '';
            } else {
                histIdx = history.length;
                input.value = '';
            }
        }
    });

    window.WebDeskJSConsole = { run: run, say: say, desk: desk };
    say('JavaScript Console, v1.1.\nType "help" for more info.\n###################################');
    attachLiveLogs();
    input.focus();
})();
</script>

</body>
</html>
