<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#38383d" />
  <title>Firefox</title>
  <link rel="icon" href="https://76836.github.io/firefox-wasm/assets/firefox-icon.png" />
  <style>
    /*
      WebDesk native (Shadow DOM) + standalone.
      Never use position:fixed to the browser viewport — that covers all of WebDesk.
      Styles stay inside :host / .wd-native-body; no desktop leakage.
    */
    :host, .wd-native-body, html, body {
      margin: 0 !important;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      background: #38383d !important;
      font-family: system-ui, sans-serif !important;
      color: #eee;
      position: relative;
      box-sizing: border-box;
    }
    html, body {
      height: 100vh;
      width: 100vw;
    }

    #screen {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
      display: block;
      touch-action: none;
    }

    #polish {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #38383d;
    }
    #polish.hide { display: none !important; }
    #polish img {
      width: 96px;
      height: 96px;
      display: block;
    }
    .polish-bar {
      width: min(180px, 40vw);
      height: 3px;
      background: #2a2a2e;
      border-radius: 2px;
      overflow: hidden;
    }
    #polish-fill {
      height: 100%;
      width: 8%;
      background: #ff7139;
      transition: width 0.2s linear;
    }

    /* Upstream stubs — never visible */
    #splash, #term, #fabs, #kb-capture, #console-output {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <section id="splash" aria-hidden="true">
    <div id="splash-shell" class="stage">
      <div id="stage-card" class="stage">
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch</button>
      <p id="jspi-note" hidden></p>
      <details class="advanced">
        <summary></summary>
        <input type="checkbox" id="opt-gpu" checked />
        <input type="checkbox" id="opt-jit" />
        <input type="text" id="opt-wisp" value="" />
      </details>
      <div id="console-output"></div>
    </div>
  </section>

  <canvas id="screen" width="1" height="1" tabindex="0"></canvas>

  <div id="polish">
    <img src="https://76836.github.io/firefox-wasm/assets/firefox-icon.png" alt="" width="96" height="96" />
    <div class="polish-bar"><div id="polish-fill"></div></div>
  </div>

  <div id="term" hidden></div>
  <textarea id="kb-capture" hidden></textarea>
  <div id="fabs" hidden></div>

  <script>
    // Polished-only WebDesk native shell. Status → browser/JS console only.
    function deskLog(level, ...a) {
      const msg = a.map((x) => (typeof x === "string" ? x : (x && x.message) || String(x))).join(" ");
      try {
        const bus = window.WebDeskLog || (window.parent && window.parent.WebDeskLog);
        bus?.write(level, "Firefox", msg);
      } catch (_) {}
      const fn = level === "error" ? console.error : level === "warn" ? console.warn : console.log;
      fn.call(console, "[Firefox]", ...a);
    }
    const log = (...a) => deskLog("log", ...a);
    const warn = (...a) => deskLog("warn", ...a);
    const err = (...a) => deskLog("error", ...a);

    function setProgress(pct) {
      const fill = document.getElementById("polish-fill");
      if (!fill || pct == null) return;
      fill.style.width = Math.round(Math.min(1, Math.max(0, pct)) * 100) + "%";
    }

    function hidePolish() {
      document.getElementById("polish")?.classList.add("hide");
      try { document.getElementById("screen")?.focus(); } catch (_) {}
    }

    async function doLaunch() {
      if (!window.crossOriginIsolated) {
        err("not crossOriginIsolated — enable isolation headers in WebDesk Settings → System");
        return;
      }
      if (window.WebDeskFS) {
        try {
          const r = await window.WebDeskFS.syncToOpfs((m) => log("WebDeskFS", m));
          log("pre-launch FS", r);
        } catch (e) {
          warn("FS pre-launch", e);
        }
      }
      setProgress(0.55);
      const ok = await window.GeckoHost.launch({ gpu: true, jit: false });
      if (!ok) err("launch refused");
    }

    function bindHost() {
      const H = window.GeckoHost;
      if (!H) {
        err("GeckoHost missing");
        return;
      }
      H.on(H.EV.progress, (e) => {
        const p = e.detail || {};
        if (p.message) log(p.message);
        if (p.percent != null) setProgress(p.percent);
      });
      H.on(H.EV.ready, () => {
        log("ready");
        setProgress(0.85);
        doLaunch();
      });
      H.on(H.EV.booted, () => {
        log("up");
        setProgress(1);
        hidePolish();
        H.sizeCanvas();
      });
      H.on(H.EV.error, (e) => {
        err((e.detail && e.detail.message) || "error");
      });
      window.GeckoHost?.on?.(window.GeckoHost.EV?.booted || "gecko:booted", () => {
        window.WebDeskFS?.injectIntoModuleFs?.((m) => log("WebDeskFS", m)).then((r) =>
          log("post-boot FS", r)
        );
      });
    }

    function patchCanvasToHost() {
      const H = window.GeckoHost;
      if (!H || H.__wdHostSized) return;
      H.__wdHostSized = true;
      H.sizeCanvas = function () {
        const canvas = document.getElementById("screen");
        if (!canvas) return { w: 1, h: 1 };
        const root = canvas.getRootNode && canvas.getRootNode();
        const host = root && root.host;
        const w = Math.max(1, ((host && host.clientWidth) || window.innerWidth) | 0);
        const h = Math.max(1, ((host && host.clientHeight) || window.innerHeight) | 0);
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        return { w, h };
      };
      try {
        const ro = new ResizeObserver(() => { try { H.sizeCanvas(); } catch (_) {} });
        const canvas = document.getElementById("screen");
        const host = canvas && canvas.getRootNode && canvas.getRootNode().host;
        if (host) ro.observe(host);
      } catch (_) {}
    }

    function start() {
      if (!window.GeckoHost) {
        err("GeckoHost not loaded — check WDNative script fetch / network");
        return;
      }
      log("crossOriginIsolated=" + !!window.crossOriginIsolated);
      if (!window.crossOriginIsolated) {
        err("SharedArrayBuffer unavailable. Settings → System → enable isolation headers, then reload WebDesk.");
      }
      window.NetStack?.boot?.();
      window.GeckoHost.init();
      patchCanvasToHost();
      bindHost();
      setProgress(0.08);
      log("WebDesk native Firefox (polished)");
    }

    window.WebDeskFirefox = { setProgress, doLaunch, log };
  </script>

  <script src="https://76836.github.io/firefox-wasm/coi-serviceworker.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/gecko-host.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/webdesk-fs.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/socket.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/tcpip.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/derp.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/wireguard.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/control.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/index.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/version.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/stack.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/wisp-local.js?v=wdn1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/tailscale.js?v=wdn1"></script>
  <script type="module" src="https://76836.github.io/firefox-wasm/assets/index-D39giZCc.js?v=wdn1"></script>
  <script>
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }
  </script>
</body>
</html>
