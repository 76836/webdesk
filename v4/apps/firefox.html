<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#38383d" />
  <title>Firefox</title>
  <link rel="icon" href="https://76836.github.io/firefox-wasm/assets/firefox-icon.png" />
  <style>
    /* Scoped to this document only (runs in its own iframe — does not touch WebDesk CSS) */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #38383d;
      font-family: system-ui, sans-serif;
    }
    #screen {
      position: fixed;
      left: 0; top: 0;
      background: #000;
      z-index: 1;
      display: block;
      touch-action: none;
    }
    #polish {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #38383d;
    }
    #polish.hide { display: none !important; }
    #polish img {
      width: 96px;
      height: 96px;
      display: block;
    }
    .polish-bar {
      width: min(180px, 40vw);
      height: 3px;
      background: #2a2a2e;
      border-radius: 2px;
      overflow: hidden;
    }
    #polish-fill {
      height: 100%;
      width: 8%;
      background: #ff7139;
      transition: width 0.2s linear;
    }
    /* Upstream needs these nodes; keep off-screen */
    #splash, #term, #fabs, #kb-capture, #console-output {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <section id="splash" aria-hidden="true">
    <div id="splash-shell" class="stage">
      <div id="stage-card" class="stage">
        <div class="progress-track"><div id="progress-fill"></div></div>
        <span id="progress-phase"></span>
        <span id="progress-percent"></span>
        <p id="splash-status"></p>
      </div>
      <button id="start-btn" type="button">Launch</button>
      <p id="jspi-note" hidden></p>
      <details class="advanced">
        <summary></summary>
        <input type="checkbox" id="opt-gpu" checked />
        <input type="checkbox" id="opt-jit" />
        <input type="text" id="opt-wisp" value="" />
      </details>
      <div id="console-output"></div>
    </div>
  </section>

  <canvas id="screen" width="1" height="1" tabindex="0"></canvas>

  <div id="polish">
    <img src="https://76836.github.io/firefox-wasm/assets/firefox-icon.png" alt="" width="96" height="96" />
    <div class="polish-bar"><div id="polish-fill"></div></div>
  </div>

  <!-- Terminal UI removed — use WebDesk JavaScript Console; keep stubs for GeckoHost -->
  <div id="term" hidden></div>
  <textarea id="kb-capture" hidden></textarea>
  <div id="fabs" hidden></div>

  <script>
    // All status goes to the real browser/WebDesk JS console
    const log = (...a) => console.log("[Firefox]", ...a);
    const warn = (...a) => console.warn("[Firefox]", ...a);
    const err = (...a) => console.error("[Firefox]", ...a);

    function setProgress(pct) {
      const fill = document.getElementById("polish-fill");
      if (!fill || pct == null) return;
      fill.style.width = Math.round(Math.min(1, Math.max(0, pct)) * 100) + "%";
    }

    function hidePolish() {
      document.getElementById("polish")?.classList.add("hide");
      try { document.getElementById("screen")?.focus(); } catch (_) {}
    }

    async function doLaunch() {
      if (!window.crossOriginIsolated) {
        err("not crossOriginIsolated — enable WebDesk isolation headers / open top-level");
        return;
      }
      if (window.WebDeskFS) {
        try {
          const r = await window.WebDeskFS.syncToOpfs((m) => log("WebDeskFS", m));
          log("pre-launch FS", r);
        } catch (e) {
          warn("FS pre-launch", e);
        }
      }
      setProgress(0.55);
      const ok = await window.GeckoHost.launch({ gpu: true, jit: false });
      if (!ok) err("launch refused");
    }

    function bindHost() {
      const H = window.GeckoHost;
      if (!H) {
        err("GeckoHost missing");
        return;
      }
      H.on(H.EV.progress, (e) => {
        const p = e.detail || {};
        if (p.message) log(p.message);
        if (p.percent != null) setProgress(p.percent);
      });
      H.on(H.EV.ready, () => {
        log("ready");
        setProgress(0.85);
        doLaunch();
      });
      H.on(H.EV.booted, () => {
        log("up");
        setProgress(1);
        hidePolish();
        H.sizeCanvas();
      });
      H.on(H.EV.error, (e) => {
        err((e.detail && e.detail.message) || "error");
      });
      window.GeckoHost?.on?.(window.GeckoHost.EV?.booted || "gecko:booted", () => {
        window.WebDeskFS?.injectIntoModuleFs?.((m) => log("WebDeskFS", m)).then((r) =>
          log("post-boot FS", r)
        );
      });
    }

    function start() {
      if (!window.GeckoHost) {
        err("GeckoHost not loaded");
        return;
      }
      window.NetStack?.boot?.();
      window.GeckoHost.init();
      bindHost();
      setProgress(0.08);
      log("WebDesk Firefox shell (polished-only)");
    }

    window.WebDeskFirefox = { setProgress, doLaunch, log };
  </script>

  <script src="https://76836.github.io/firefox-wasm/coi-serviceworker.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/gecko-host.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/webdesk-fs.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/socket.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/tcpip.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/derp.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/wireguard.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/control.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/usernet/index.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/version.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/stack.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/wisp-local.js?v=wd1"></script>
  <script src="https://76836.github.io/firefox-wasm/net/tailscale.js?v=wd1"></script>
  <script type="module" src="https://76836.github.io/firefox-wasm/assets/index-D39giZCc.js?v=wd1"></script>
  <script>
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }
  </script>
</body>
</html>
