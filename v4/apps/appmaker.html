<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenter</title>
    <link rel="stylesheet" href="../style.css">
<style>
    :root {
        --primary: #25ffff;
        --on-primary: #021b25;
        --surface: #0b1117;
        --secondary-container: rgba(55, 55, 55, 0.5);
        --on-secondary-container: #e4f3ff;
        --error: #8c1d18;
        --on-error: #f9dedc;
        --outline: rgba(200, 200, 255, 0.25);
        --text: #e4f3ff;
        --card: rgba(55, 55, 55, 0.5);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #a8c7fa;
            --on-primary: #062e6f;
            --surface: #111318;
            --secondary-container: #4a4458;
            --on-secondary-container: #e8def8;
            --error: #8c1d18;
            --on-error: #f9dedc;
            --outline: #939091;
            --text: #e3e3e3;
            --card: #1e1f20;
        }
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Roboto, sans-serif;
        background: transparent;
        color: var(--text);
        padding: 16px;
        display: grid;
        gap: 20px;
        max-width: 800px;
        margin: auto;
        transition: background-color 0.3s ease;
        overflow: auto;
        min-height: 100%;
    }

    section {
        background: var(--card);
        border: var(--wd-glass-border);
        backdrop-filter: blur(8px);
        padding: 24px;
        border-radius: 28px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    h2, h3 { margin-top: 0; font-weight: 400; color: var(--text); letter-spacing: -0.5px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 500; margin-left: 4px; }

    input[type="text"], input[type="url"] {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--outline);
        border-radius: 12px;
        background: transparent;
        box-sizing: border-box;
        color: var(--text);
    }

    .btn {
        border: none;
        padding: 10px 20px;
        border-radius: 100px;
        font-weight: 500;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-danger { background: var(--error); color: var(--on-error); }

    .app-item {
        display: flex;
        align-items: center;
        padding: 12px;
        background: var(--card);
        border-radius: 16px;
        margin-bottom: 12px;
        border: 1px solid var(--outline);
        opacity: 0.9;
    }

    .app-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        object-fit: cover;
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        flex-shrink: 0;
    }

    .app-details { flex-grow: 1; min-width: 0; margin-left: 16px;}
    .app-title { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-url { font-size: 0.75rem; color: var(--outline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

    <section>
        <h2>AppCenter</h2>
        <div class="form-group"><label>Title</label><input type="text" id="appTitle"></div>
        <div class="form-group"><label>URL</label><input type="url" id="appUrl"></div>
        <div class="form-group"><label>Icon URL (Optional)</label><input type="url" id="iconUrl"></div>
        <button class="btn btn-primary" onclick="createApp()">Create Custom App</button>
    </section>

    <section>
        <h3>Installed Apps</h3>
        <div id="installedApps"></div>
    </section>

    <section>
        <h3>Not Installed Apps</h3>
        <div id="marketplaceApps"></div>
    </section>

    <script>
        const BASE_URL = "https://76836.github.io/";
        const catalog = [
            { title: "Akari", path: "Akari/app", iconUrl: "https://76836.github.io/Akari/images/logo512.png" },
            //{ title: "AppCenter", path: "AppCenter" },
            { title: "Digita", path: "Digita", iconUrl: "https://76836.github.io/Digita/logo/512.png" },
            { title: "side-glow", path: "side-glow" },
            { title: "Lunabot", path: "lunabot/app", iconUrl: "https://76836.github.io/lunabot/app/icon-512.png" },
            { title: "Terminal", path: "webdesk/programs/terminal", iconUrl: "https://76836.github.io/webdesk/programs/terminal/apple-touch-icon.png" },
            //{ title: "Webdesk", path: "bootloader" },
            { title: "Animaxxer", path: "animaxxer", iconUrl: "https://76836.github.io/animaxxer/icon-512.png"},
            //{ title: "404", path: "404" },
            { title: "CtrlBox", path: "ctrlbox", iconUrl: "https://76836.github.io/ctrlbox/icon.png" },
            //{ title: "Wanderer", path: "Wanderer" },
            //{ title: "Squares", path: "squares" },
            //{ title: "meatsalad", path: "meatsalad" },
            { title: "Calculator", path: "CalculatorXP", iconUrl: "https://76836.github.io/CalculatorXP/icon.png" },
            { title: "Simple AI", path: "FREE_AI.html" },
            { title: "Image Studio", path: "pollinations_image_client.html" }
        ];

        window.onload = loadApps;

        function createApp(title, url, icon) {
            const t = title || document.getElementById('appTitle').value;
            const u = url || document.getElementById('appUrl').value;
            const i = icon || document.getElementById('iconUrl').value;

            if (!t || !u) return alert("Title and URL required");

            const appId = 'webapp-' + t.toLowerCase().replace(/[^a-z0-9]/g, '-');
            const app = {
                id: appId,
                config: { title: t, url: u, iconUrl: i || `${u}/apple-touch-icon.png`, useIframe: true }
            };

            const apps = getStored();
            if (!apps.find(a => a.id === appId)) apps.push(app);
            
            localStorage.setItem('WebDesk_custom_apps', JSON.stringify(apps));
            window.parent.postMessage({ type: 'registerApp', app }, '*');
            loadApps();
        }

      function loadApps() {
    const installed = getStored();
    const installedIds = installed.map(a => a.id);
    
    const instContainer = document.getElementById('installedApps');
    instContainer.innerHTML = '';
    installed.forEach(app => {
        instContainer.appendChild(createAppRow(app, true));
    });

    const markContainer = document.getElementById('marketplaceApps');
    markContainer.innerHTML = '';
    catalog.forEach(item => {
        const fullUrl = BASE_URL + item.path;
        const id = 'webapp-' + item.title.toLowerCase().replace(/[^a-z0-9]/g, '-');
        
        // Use custom iconUrl if provided, otherwise fallback to default path
        const resolvedIcon = item.iconUrl || `${fullUrl}/apple-touch-icon.png`;

        if (!installedIds.includes(id)) {
            markContainer.appendChild(createAppRow({
                id: id,
                config: { title: item.title, url: fullUrl, iconUrl: resolvedIcon }
            }, false));
        }
    });
}

        function createAppRow(app, isInstalled) {
            const div = document.createElement('div');
            div.className = 'app-item';
            const icon = app.config.iconUrl;
            
            div.innerHTML = `
                <div class="app-icon" style="background-color:hsl(${app.config.title.length * 40}, 60%, 80%)">
                    <img src="${icon}" class="app-icon" onerror="this.style.display='none'; this.parentElement.innerText='${app.config.title[0]}'">
                </div>
                <div class="app-details">
                    <div class="app-title">${app.config.title}</div>
                    <div class="app-url">${app.config.url}</div>
                </div>
                <button class="btn ${isInstalled ? 'btn-danger' : 'btn-primary'}" 
                    onclick="${isInstalled ? `deleteApp('${app.id}')` : `createApp('${app.config.title}', '${app.config.url}', '${app.config.iconUrl}')`}">
                    ${isInstalled ? 'Uninstall' : 'Install'}
                </button>
            `;
            return div;
        }

        function deleteApp(appId) {
            const apps = getStored().filter(a => a.id !== appId);
            localStorage.setItem('WebDesk_custom_apps', JSON.stringify(apps));
            window.parent.postMessage({ type: 'unregisterApp', appId }, '*');
            loadApps();
        }

        function getStored() {
            return JSON.parse(localStorage.getItem('WebDesk_custom_apps') || '[]');
        }
    </script>
</body>

</html>
