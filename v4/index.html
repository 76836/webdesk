<!DOCTYPE html>
<html>
<head>
  <title>WebDesk 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap');

    /* --- LOADING SCREEN STYLES --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: "Rubik Glitch", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000; /* Above everything */
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-name {
      font-size: 6.5rem;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(135deg, #fff 30%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-accent-text {
      background: linear-gradient(90deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loader-track {
      width: 20rem;
      height: 14px;
      background: linear-gradient(90deg, rgba(159, 130, 146, 0.73), rgba(59, 130, 246, 0.71));
      border-radius: 3.5px;
      position: relative;
      overflow: hidden;
      margin-top: 32px;
    }

    .loader-bar {
      position: absolute;
      background-color: rgba(235, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      height: calc(100% - 8px);
      margin-top: 2px;
      width: 50%;
      border-radius: 7px;
      animation: slide 1s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      border: 2px inset rgba(255, 255, 255, 0.35);
    }

    @keyframes slide {
      0% { left: -50%; width: 30%; }
      50% { width: 70%; }
      100% { left: 100%; width: 30%; }
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-container">
        <h1 class="brand-name">Webdesk&nbsp;<span class="brand-accent-text">OS</span></h1>
        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>
    </div>
  </div>

  <div class="os-desktop">
    <div class="shelf">
      <div class="shelf-items-left">
        <div class="shelf-item app-launcher"></div>
      </div>
      <div class="shelf-item status-area"> 
        <div class="status-date">
          <span class="date">Apr 7</span>
        </div>
        <div class="status-main">
          <span class="time">10:10 AM</span>
          <span class="wifi-icon"></span>
          <span class="battery-icon"></span>
        </div>
      </div>
    </div>

    <div class="app-launcher-view hidden">
        <div class="launcher-search">
          <input type="text" placeholder="Find apps with your keyboard">
          <select id="launcher-sort" aria-label="Sort apps">
            <option value="recent">Most recent</option>
            <option value="alpha">A-Z</option>
          </select>
        </div>
        <div class="launcher-grid">
          <div class="launcher-app" data-app="themes">
              <div class="launcher-app-icon placeholder-icon"></div>
              <span class="launcher-app-name">Settings</span>
          </div>
          <div class="launcher-app" data-app="chrome">
              <div class="launcher-app-icon placeholder-icon"></div>
              <span class="launcher-app-name">76836</span>
          </div>
        </div>
    </div>
    <div id="snap-overlay" class="hidden"></div>
    <div id="brightness-overlay"></div>

    <div class="quick-settings-menu hidden">
      <div class="quick-settings-header">
        <span>WebDesk 2026 (v1.3.0)</span>
      </div>
      <div class="quick-settings-grid">
        <div class="quick-settings-tile internet-tile">
          <svg class="tile-icon" height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <span class="tile-label">Internet</span>
          <span class="tile-sublabel">Internet (unknown)</span>
        </div>
        
        <div class="quick-settings-tile focus-tile" id="fullscreen-tile">
          <svg class="tile-icon" height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368">
            <path d="M0 0h24v24H0V0z" fill="none"/>
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
          <span class="tile-label">Fullscreen</span>
          <span id="fs-status" class="tile-sublabel">Off</span>
        </div>

        <div class="quick-settings-tile lightmode-tile" id="lightmode-tile">
          <svg class="tile-icon" height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zm10.45-1.79l-1.79 1.79 1.41 1.42 1.8-1.8-1.42-1.41zM12 4h1V1h-2v3h1zm-8 9H1v-2h3v2zm19 0h-3v-2h3v2zm-11 8h1v3h-2v-3h1zm6.24-1.16l1.8 1.79 1.41-1.41-1.79-1.8-1.42 1.42zM4.96 20.63l1.79-1.79-1.41-1.42-1.8 1.8 1.42 1.41zM12 6a6 6 0 100 12 6 6 0 000-12z"/></svg>
          <span class="tile-label">Light mode</span>
          <span class="tile-sublabel" id="lightmode-status">Off</span>
        </div>
      </div>

      <div class="quick-settings-slider brightness-slider">
        <svg height="20px" viewBox="0 0 24 24" width="20px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>
        <input type="range" min="0" max="101" value="100">
      </div>

      <div class="quick-settings-footer">
        <div class="battery-info">
          <svg height="20px" viewBox="0 0 24 24" width="20px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM15 20H9v-1.47l1.3-.65C11.07 17.4 11.5 16.72 11.5 16V8h1v8c0 .72.43 1.4 1.2 1.87l1.3.65V20z"/></svg>
          <span id="battery-status">Battery: --</span>
        </div>
        <div class="footer-icons">
          <button onclick="window.location.reload();" class="footer-icon-btn" id="qs-power-btn" title="Power">
            <svg height="26px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><path d="M13,3h-2v10h2V3z M17.83,5.17l-1.41,1.41C17.62,7.79,18,9.3,18,11c0,3.31-2.69,6-6,6s-6-2.69-6-6 c0-1.7,0.38-3.21,1.58-4.42L6.17,5.17C4.23,7.11,3,9.79,3,12.5C3,16.09,5.91,19,9.5,19h5c3.59,0,6.5-2.91,6.5-6.5 C21,9.79,19.77,7.11,17.83,5.17z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="core/init.js"></script>

  <script>
    // 1. Loading Screen Logic
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash-screen');
      setTimeout(() => {
        splash.classList.add('fade-out');
        // Remove from DOM after transition so it doesn't block clicks
        setTimeout(() => splash.remove(), 200);
      }, 5000);
    });

    // 2. Fullscreen Logic
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.error(err.message));
      } else {
        document.exitFullscreen();
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const status = document.getElementById('fs-status');
      if(status) status.textContent = document.fullscreenElement ? "On" : "Off";
    });

    // 3. Internet Status
    async function updateConnectionStatus() {
      const statusSpan = document.querySelector('.internet-tile .tile-sublabel');
      try {
        await fetch('https://www.google.com/generate_204', { method: 'HEAD', mode: 'no-cors' });
        if (statusSpan) statusSpan.textContent = 'Connected';
      } catch {
        if (statusSpan) statusSpan.textContent = 'Disconnected';
      }
    }
    updateConnectionStatus();
    setInterval(updateConnectionStatus, 60000);

    // 4. Wallpaper & Brightness
    const brightnessOverlay = document.getElementById('brightness-overlay');
    brightnessOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;pointer-events:none;z-index:9998;opacity:0;transition:opacity 0.1s linear;';

    window.addEventListener('message', (e) => {
      if (e.data.type === 'setWallpaper') {
        applyWallpaper(e.data.url);
        localStorage.setItem('wallpaper', e.data.url);
      }
    });

    function applyWallpaper(url) {
      const desktop = document.querySelector('.os-desktop');
      if (desktop) {
        desktop.style.backgroundImage = `url('${url}')`;
        desktop.style.backgroundSize = 'cover';
        desktop.style.backgroundPosition = 'center';
        desktop.style.backgroundAttachment = 'fixed';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const slider = document.querySelector('.brightness-slider input');
      const savedWall = localStorage.getItem('wallpaper');
      if (savedWall) applyWallpaper(savedWall);

      const updateB = (val) => brightnessOverlay.style.opacity = ((100 - val) / 100) * 0.75;
      if (slider) {
        updateB(slider.value);
        slider.addEventListener('input', (e) => updateB(e.target.value));
      }
    });
  </script>
</body>
</html>
