<body>

    </div>
    
    <div class="app-window themes-app hidden">
      <div class="title-bar">
        <span class="title">Wallpaper & Themes</span>
        <div class="window-controls">
          <span class="minimize" title="Minimize">
            <svg   height="12" width="12" viewBox="0 0 12 12"><path fill="#000000" d="M2 6h8v1H2z"/></svg>
          </span>
          <span class="maximize" title="Maximize">
            <svg class="maximize-icon"   height="10" width="10" viewBox="0 0 10 10"><path fill="none" stroke="#000000" stroke-width="1.5" d="M1 1h8v8H1z"/></svg>
            <svg class="restore-icon"   height="10" width="10" viewBox="0 0 10 10" style="display:none;"><path fill="none" stroke="#000000" stroke-width="1.5" d="M3 1h6v6H3z M1 3h6v6H1z"/></svg>
          </span>
          <span class="close" title="Close">
            <svg   height="12" width="12" viewBox="0 0 12 12"><path fill="#000000" d="M11 1.6L10.4 1 6 5.4 1.6 1 1 1.6 5.4 6 1 10.4l.6.6L6 6.6l4.4 4.4.6-.6L6.6 6z"/></svg>
          </span>
        </div>
      </div>
      <div class="app-content"></div>
    </div>

    <div class="app-launcher-view hidden">
       <div class="launcher-search">
         <input type="text" placeholder="Ask Akari...">
       </div>
       <div class="launcher-grid">
         <div class="launcher-app" data-app="themes">
             <div class="launcher-app-icon placeholder-icon"></div>
             <span class="launcher-app-name">Settings</span>
         </div>
         <div class="launcher-app" data-app="chrome">
             <div class="launcher-app-icon placeholder-icon"></div>
             <span class="launcher-app-name">76836</span>
         </div>
        
       </div>
    </div>
    <div id="snap-overlay" class="hidden"></div>
    <div id="brightness-overlay"></div>

    <!-- Quick Settings Menu -->
    <div class="quick-settings-menu hidden">
      <div class="quick-settings-header">
        <span>WebDesk 2025 v1.0</span>
        <!-- Add more header controls if needed -->
      </div>
      <div class="quick-settings-grid">
        <div class="quick-settings-tile internet-tile">
          <svg class="tile-icon"   height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <span class="tile-label">Internet</span>
          <script>
            async function updateConnectionStatus() {
              try {
                const response = await fetch('https://www.google.com/generate_204', { method: 'HEAD', mode: 'no-cors' });
                const statusSpan = document.querySelector('.internet-tile .tile-sublabel');
                if (statusSpan) {
                  statusSpan.textContent = 'Connected';
                }
              } catch {
                const statusSpan = document.querySelector('.internet-tile .tile-sublabel');
                if (statusSpan) {
                  statusSpan.textContent = 'Disconnected';
                }
              }
            }
            
            updateConnectionStatus();
            setInterval(updateConnectionStatus, 60000);
          </script>
          <span class="tile-sublabel">Internet (unknown)</span>
        </div>
        <div class="quick-settings-tile focus-tile" onclick="toggleFullScreen()" style="cursor: pointer;">
  <svg class="tile-icon" height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368">
    <path d="M0 0h24v24H0V0z" fill="none"/>
    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
  </svg>
  <span class="tile-label">Fullscreen</span>
  <span id="fs-status" class="tile-sublabel">Off</span>
</div>

<script>
  function toggleFullScreen() {
    const status = document.getElementById('fs-status');
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.error(`Error: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const status = document.getElementById('fs-status');
    status.textContent = document.fullscreenElement ? "On" : "Off";
  });
</script>
        <div class="quick-settings-tile focus-tile">
          <svg class="tile-icon"   height="24px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm-1.5-5h3v-2h-3v2zm0-3h3V7h-3v5z"/></svg>

          <span class="tile-sublabel">Doesn't do anything...</span>
        </div>
      </div>
      <div class="quick-settings-slider brightness-slider">
        <svg   height="20px" viewBox="0 0 24 24" width="20px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>
        <input type="range" min="0" max="101" value="100">
      </div>
      <div class="quick-settings-footer">
        <div class="battery-info">
          <svg   height="20px" viewBox="0 0 24 24" width="20px" fill="#5f6368"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM15 20H9v-1.47l1.3-.65C11.07 17.4 11.5 16.72 11.5 16V8h1v8c0 .72.43 1.4 1.2 1.87l1.3.65V20z"/></svg>
          <span>Battery API unavailable...</span>
        </div>
        <div class="footer-icons">
          <button onclick="window.location.reload();" class="footer-icon-btn" id="qs-power-btn" title="Power">
            <svg   enable-background="new 0 0 24 24" height="26px" viewBox="0 0 24 24" width="24px" fill="#5f6368"><g><rect fill="none" height="24" width="24"/></g><g><path d="M13,3h-2v10h2V3z M17.83,5.17l-1.41,1.41C17.62,7.79,18,9.3,18,11c0,3.31-2.69,6-6,6s-6-2.69-6-6 c0-1.7,0.38-3.21,1.58-4.42L6.17,5.17C4.23,7.11,3,9.79,3,12.5C3,16.09,5.91,19,9.5,19h5c3.59,0,6.5-2.91,6.5-6.5 C21,9.79,19.77,7.11,17.83,5.17z"/></g></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Initialize OS -->
  <script type="module" src="core/init.js"></script>
  
  <!-- Wallpaper Manager & Brightness Control -->
  <script>
    // Initialize brightness overlay styles
    const brightnessOverlay = document.getElementById('brightness-overlay');
    brightnessOverlay.style.position = 'fixed';
    brightnessOverlay.style.top = '0';
    brightnessOverlay.style.left = '0';
    brightnessOverlay.style.width = '100%';
    brightnessOverlay.style.height = '100%';
    brightnessOverlay.style.backgroundColor = '#000000';
    brightnessOverlay.style.pointerEvents = 'none';
    brightnessOverlay.style.zIndex = '9998';
    brightnessOverlay.style.opacity = '0';
    brightnessOverlay.style.transition = 'opacity 0.1s linear';

    // Listen for wallpaper change messages from settings iframe
    window.addEventListener('message', function(event) {
      if (event.data.type === 'setWallpaper') {
        const wallpaperUrl = event.data.url;
        applyWallpaper(wallpaperUrl);
        // Save to localStorage
        localStorage.setItem('wallpaper', wallpaperUrl);
      }
    });

    // Apply wallpaper to the desktop
    function applyWallpaper(url) {
      const desktop = document.querySelector('.os-desktop');
      if (desktop) {
        desktop.style.backgroundImage = `url('${url}')`;
        desktop.style.backgroundSize = 'cover';
        desktop.style.backgroundPosition = 'center';
        desktop.style.backgroundAttachment = 'fixed';
      }
    }

    // Handle brightness slider changes
    document.addEventListener('DOMContentLoaded', function() {
      const brightnessSlider = document.querySelector('.brightness-slider input[type="range"]');
      const savedWallpaper = localStorage.getItem('wallpaper');
      if (savedWallpaper) {
        applyWallpaper(savedWallpaper);
      }

      // Update brightness overlay opacity based on slider value
      function updateBrightness(value) {
        // Value range 0-101, convert to opacity 0-0.5 (ensures UI remains usable)
        // At 100, opacity should be 0 (full brightness). At 0, opacity should be 0.5 (50% dimmed)
        const opacity = ((100 - value) / 100) * 0.5;
        brightnessOverlay.style.opacity = opacity.toString();
      }

      if (brightnessSlider) {
        // Set initial brightness from slider value
        updateBrightness(brightnessSlider.value);

        // Update on slider change
        brightnessSlider.addEventListener('input', function() {
          updateBrightness(this.value);
        });
      }
    });
  </script>
</body>
</html>
