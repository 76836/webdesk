<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebDesk Mobile v1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-shell os-desktop">
    <header class="status-bar status-area" role="button" aria-label="Open control center">
      <div class="status-left"><span class="time">10:10</span></div>
      <div class="status-center"><span class="date">Apr 27</span></div>
      <div class="status-right">
        <span class="wifi-icon" aria-hidden="true"></span>
        <span class="battery-icon" aria-hidden="true"></span>
      </div>
    </header>

    <main class="workspace">
      <section class="home-screen" aria-label="Home screen">
        <div class="home-grid launcher-grid"></div>
      </section>

      <section class="app-switcher hidden" aria-label="Recent apps">
        <div class="switcher-header">Recent apps</div>
        <div class="switcher-list" id="switcher-list"></div>
      </section>
    </main>

    <div class="quick-settings-menu hidden">
      <div class="quick-settings-header"><span>Control center</span></div>
      <div class="quick-settings-grid">
        <button class="quick-settings-tile" id="fullscreen-tile">
          <span class="tile-label">Fullscreen</span>
          <span class="tile-sublabel" id="fs-status">Off</span>
        </button>
        <button class="quick-settings-tile lightmode-tile" id="lightmode-tile">
          <span class="tile-label">Light mode</span>
          <span class="tile-sublabel" id="lightmode-status">Off</span>
        </button>
      </div>
      <div class="quick-settings-slider brightness-slider">
        <input type="range" min="0" max="101" value="100" aria-label="Brightness">
      </div>
      <div class="quick-settings-footer">
        <span id="battery-status">Battery: --</span>
      </div>
    </div>

    <nav class="nav-bar" aria-label="Android navigation">
      <button class="nav-button" id="nav-back" aria-label="Back">◁</button>
      <button class="nav-button nav-home" id="nav-home" aria-label="Home">◯</button>
      <button class="nav-button" id="nav-recents" aria-label="Recents">▢</button>
    </nav>
  </div>

  <script type="module" src="core/init.js"></script>
</body>
</html>
