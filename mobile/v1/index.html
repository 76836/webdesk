<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebDesk Mobile v1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-shell os-desktop" id="mobile-shell">
    <div class="wallpaper-layer" id="wallpaper-layer" aria-hidden="true"></div>

    <header class="status-bar status-area" role="button" aria-label="Open control center">
      <span class="status-time time">10:10</span>
      <div class="status-icons">
        <span class="cell-signal" aria-hidden="true"></span>
        <span class="wifi-icon" aria-hidden="true"></span>
        <span class="battery-pill"><span class="battery-percent">100%</span></span>
      </div>
    </header>

    <section class="quick-settings-menu hidden" aria-label="Control center">
      <div class="quick-settings-top-row">
        <div class="qs-date date">Apr 28</div>
        <button class="qs-close" id="qs-close" aria-label="Close control center">✕</button>
      </div>
      <div class="quick-settings-grid">
        <button class="quick-settings-tile active" id="internet-tile"><span class="tile-label">Internet</span><span class="tile-sublabel">Connected</span></button>
        <button class="quick-settings-tile" id="fullscreen-tile"><span class="tile-label">Fullscreen</span><span class="tile-sublabel" id="fs-status">Off</span></button>
        <button class="quick-settings-tile lightmode-tile" id="lightmode-tile"><span class="tile-label">Light mode</span><span class="tile-sublabel" id="lightmode-status">Off</span></button>
        <button class="quick-settings-tile" id="home-lock-tile"><span class="tile-label">Home lock</span><span class="tile-sublabel">Edit off</span></button>
      </div>
      <div class="quick-settings-slider brightness-slider">
        <input type="range" min="30" max="100" value="100" aria-label="Brightness">
      </div>
      <div class="quick-settings-footer"><span id="battery-status">Battery: --</span></div>
    </section>

    <main class="workspace" id="workspace">
      <section class="home-screen" id="home-screen" aria-label="Home screen">
        <div class="home-pages-track" id="home-pages-track"></div>
        <div class="page-indicators" id="page-indicators"></div>
      </section>

      <section class="app-switcher hidden" id="app-switcher" aria-label="Recent apps">
        <div class="switcher-header">Recent apps</div>
        <div class="switcher-list" id="switcher-list"></div>
      </section>
    </main>

    <nav class="nav-bar" aria-label="Android navigation">
      <button class="nav-button" id="nav-back" aria-label="Back">◁</button>
      <button class="nav-button nav-home" id="nav-home" aria-label="Home">◯</button>
      <button class="nav-button" id="nav-recents" aria-label="Recents">▢</button>
    </nav>
  </div>

  <script type="module" src="core/init.js"></script>
</body>
</html>
