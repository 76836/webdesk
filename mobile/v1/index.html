<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>WebDesk Mobile</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="phone-shell" class="phone-shell wallpaper-default">
    <div id="status-bar" class="status-bar" role="button" aria-label="Open control center">
      <div class="status-left"><span id="status-time">10:10</span></div>
      <div class="status-right">
        <span class="sig" aria-hidden="true"></span>
        <span class="wifi" aria-hidden="true"></span>
        <span id="status-battery">100%</span>
      </div>
    </div>

    <main id="home" class="home">
      <section id="homescreen-pages" class="homescreen-pages" aria-label="Homescreen pages"></section>
      <div class="page-dots" id="page-dots"></div>
      <div id="dock" class="dock" aria-label="Dock"></div>
    </main>

    <section id="app-layer" class="app-layer hidden" aria-live="polite">
      <div class="window-controls">
        <button type="button" data-window-action="minimize" aria-label="Minimize">▁</button>
        <button type="button" data-window-action="maximize" aria-label="Fullscreen">▢</button>
        <button type="button" data-window-action="close" aria-label="Close">✕</button>
      </div>
      <div id="app-host" class="app-host"></div>
    </section>

    <section id="recents" class="recents hidden" aria-label="Recent apps">
      <div id="recents-list" class="recents-list"></div>
      <button type="button" id="btn-clear-recents" class="clear-all">Clear all</button>
    </section>

    <section id="app-picker" class="sheet hidden" aria-label="All apps">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <strong>All apps</strong>
        <button type="button" id="btn-close-picker" class="ghost">Close</button>
      </header>
      <p class="sheet-hint">Tap to open · long-press home icons to rearrange</p>
      <div id="app-picker-list" class="all-apps-grid"></div>
    </section>

    <section id="control-center" class="control-center hidden" aria-label="Control center">
      <header>
        <strong>Control center</strong>
        <span id="cc-date"></span>
      </header>
      <div class="qs-grid">
        <button type="button" class="qs-tile" id="tile-wifi">Wi‑Fi</button>
        <button type="button" class="qs-tile" id="tile-bt">Bluetooth</button>
        <button type="button" class="qs-tile" id="tile-rotation">Rotation</button>
        <button type="button" class="qs-tile" id="tile-fullscreen">Fullscreen</button>
      </div>
      <label class="slider-label">Brightness
        <input id="brightness-slider" type="range" min="35" max="110" value="100" />
      </label>
      <label class="slider-label">Wallpaper
        <select id="wallpaper-select">
          <option value="default">Default</option>
          <option value="water">Water</option>
          <option value="foreshadowing">Foreshadowing</option>
        </select>
      </label>
    </section>

    <nav class="system-nav" aria-label="System navigation">
      <button type="button" id="nav-back" aria-label="Back"><span class="nav-icon">◁</span></button>
      <button type="button" id="nav-home" aria-label="Home"><span class="nav-icon nav-home-pill"></span></button>
      <button type="button" id="nav-recents" aria-label="Recents"><span class="nav-icon nav-recents-sq"></span></button>
    </nav>
  </div>

  <template id="home-page-template">
    <div class="home-page" role="list"></div>
  </template>
  <template id="search-widget-template">
    <div class="search-widget" draggable="true" data-item-type="widget">
      <input type="search" placeholder="Search" aria-label="Search apps" />
    </div>
  </template>
  <template id="app-icon-template">
    <button type="button" class="app-icon" draggable="true" data-item-type="app" role="listitem">
      <span class="icon-wrap">
        <span class="app-glyph" aria-hidden="true"></span>
        <img class="app-img hidden" alt="" />
        <span class="badge-remove hidden" aria-label="Remove">−</span>
      </span>
      <span class="app-name"></span>
    </button>
  </template>

  <script src="./app.js"></script>
</body>
</html>
