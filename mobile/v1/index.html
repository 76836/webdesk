<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WebDesk Mobile v1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="phone">
    <div id="wallpaper"></div>

    <header id="statusBar">
      <span id="statusTime">9:41</span>
      <div class="statusIcons">
        <span>📶</span><span>🔋</span>
      </div>
    </header>

    <section id="controlCenter" class="hidden">
      <div class="sheetHandle"></div>
      <div class="ccGrid">
        <button id="wifiTile" class="tile">Wi‑Fi</button>
        <button id="lightTile" class="tile">Light</button>
        <button id="fsTile" class="tile">Fullscreen</button>
        <button id="editTile" class="tile">Edit Home</button>
      </div>
      <label class="sliderRow">Brightness <input id="brightnessSlider" type="range" min="40" max="120" value="100" /></label>
      <div id="batteryText">Battery: --</div>
    </section>

    <main id="homeSurface">
      <div id="homePages"></div>
      <div id="pageDots"></div>
    </main>

    <section id="appSurface"></section>

    <section id="recents" class="hidden">
      <div id="recentsList"></div>
    </section>

    <nav id="navBar">
      <button id="backBtn" aria-label="Back">◁</button>
      <button id="homeBtn" aria-label="Home">◯</button>
      <button id="recentsBtn" aria-label="Recents">▢</button>
    </nav>
  </div>

  <script type="module" src="./core/init.js"></script>
</body>
</html>
